<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Greater Toronto Multiple Alarm Association</title>
    <script type="text/javascript">
      // Save the current path (without trailing slash) and redirect to the root
      if (location.pathname !== '/' && location.pathname !== '/index.html') {
        let path = location.pathname;
        if (path.length > 1 && path.endsWith('/')) {
          path = path.slice(0, -1);
        }
        sessionStorage.redirect = path + location.search + location.hash;
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
  </body>
</html>
